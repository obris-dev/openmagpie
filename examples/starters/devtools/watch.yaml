# Companion watch for the developer-tooling starter. See feed.yaml and
# examples/README.md. The seed wires feed_ids to the created feed automatically;
# hand-applying with `magpie watch create -f` needs the real feed id here.
name: "Dev tool opportunities (starter)"
is_active: true
feed_ids:
  - REPLACE_WITH_FEED_ID
actions:
  - kind: semantic_filter
    config:
      instructions: "Someone hitting a problem a developer tool could solve, or asking for a tool recommendation."
      threshold: 0.6
  - kind: log
    config:
      prefix: "[devtools starter]"
  # Prefer a push over a log line? Uncomment and point at your notifier (ntfy, or
  # a relay like a Slack/Discord webhook or openclaw-style instance). A webhook also
  # records a delivery audit you can inspect with `magpie delivery list --action <action_id>`:
  # - kind: webhook
  #   config:
  #     url: "https://your-notifier.example/hook"
  #     method: POST
