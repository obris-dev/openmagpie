# OpenMagpie starter: developer-tooling listening.
# Apply with the seed flow (it sets the first-tick lookback for you):
#   make quickstart        (seeds + ticks)   or   make local-seed STARTER=devtools
# Applying by hand with `magpie feed create -f` works too, but then YOU set a
# past last_event_at on each source or the first tick only sees brand-new posts.
# Full walkthrough: examples/README.md
name: "Developer tooling (starter)"
kind: curated
poll_interval_seconds: 300
data:
  retention_days: 30
sources:
  - spec: {kind: reddit_subreddit, subreddit: devops}
  - spec: {kind: reddit_subreddit, subreddit: programming}

# Backfill window, by hand (the seed flow sets this for you; skip it then).
# Each source can carry a `last_event_at`: the point in time it starts reading
# from. A past UTC timestamp pulls everything posted since then on the FIRST
# tick (so you have posts to score right away); leave it off and the first tick
# only sees posts that arrive AFTER you create the feed. It is a sibling key of
# `spec` (same indent), not a field inside the spec map. A source with it set
# looks exactly like this:
#
# sources:
#   - spec: {kind: reddit_subreddit, subreddit: devops}
#     last_event_at: 2026-06-01T00:00:00Z   # read posts from 2026-06-01 up to now
#   - spec: {kind: reddit_subreddit, subreddit: programming}
#     last_event_at: 2026-06-01T00:00:00Z
