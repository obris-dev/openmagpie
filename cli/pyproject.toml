[project]
name = "openmagpie-cli"
version = "0.1.0"
description = "The magpie CLI — talks to an OpenMagpie server."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
magpie = "openmagpie.cli:app"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.57.0",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmagpie"]
