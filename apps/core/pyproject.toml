# No [build-system]/packages block (unlike cli + openmagpie-schema):
# core is a Django app run via manage.py and `uv run`, never built or
# installed as a wheel. uv treats it as a virtual workspace member -
# its deps resolve, its code is never packaged.

[project]
name = "openmagpie-core"
version = "0.1.0"
description = "OpenMagpie core — open-source semantic listener"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.5",
    "django-cors-headers>=4.6",
    "django-oauth-toolkit>=3.0",
    "djangorestframework>=3.15",
    "feedparser>=6.0",
    "httpx>=0.28",
    "openai>=1.40",  # official client; the lingua franca every OpenAI-compatible backend tests against
    "openmagpie-schema",
    "psycopg>=3.3",  # impl extra is env-specific: [binary] in dev, [c] in cloud
    "pydantic>=2.5",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",  # reads the examples/starters/*.yaml in seed_quickstart
    "ulid>=1.1",
]

[dependency-groups]
dev = [
    "django-stubs>=5.1",
    # psycopg's prebuilt binary (bundles libpq) for frictionless local dev;
    # the cloud image compiles psycopg[c] against system libpq instead.
    "psycopg[binary]>=3.3",
    "ruff>=0.11",
    "ty>=0.0.1",
    "watchfiles>=1.0",
]
# Cloud-only (matches DJANGO_ENV=cloud / conf.settings.cloud). NOT installed by
# a default `uv sync`, so local dev / CI / tests stay lean and never need
# gunicorn; the cloud Docker image opts in with `uv sync --group cloud`. Locked
# in uv.lock, so the version is reproducible. (The `dev` group above keeps its
# name because uv auto-installs the group literally named `dev`.)
cloud = [
    "gunicorn>=23.0",
    # psycopg's C build (compiled against system libpq) — psycopg's documented
    # prod choice; the Dockerfile installs libpq-dev (build) + libpq5 (runtime).
    "psycopg[c]>=3.3",
]

# openmagpie-schema is resolved as a workspace member; the workspace
# source is declared once at the repo-root pyproject (applies to all
# members). See project memory project_schema_authority_northstar.
