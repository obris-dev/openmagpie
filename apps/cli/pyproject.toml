[project]
name = "openmagpie"
version = "0.6.0"
description = "The magpie CLI — talks to an OpenMagpie server."
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "httpx>=0.28",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.scripts]
magpie = "openmagpie.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "ty>=0.0.1",
    # Dev/test/typecheck only: resolved as the editable workspace member
    # (root pyproject declares the workspace source). It is deliberately
    # NOT a [project.dependency] - see the vendoring note below.
    "openmagpie-schema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openmagpie"]

# Standalone-installable by VENDORING openmagpie-schema into the wheel.
#
# openmagpie-schema is single-sourced once in the repo and resolved as
# a uv workspace member for dev (see project memory
# project_schema_authority_northstar). A uv workspace source is
# dev-only - it does not travel in wheel metadata - so it is NOT a
# [project.dependency] (a `pipx install` / `uv tool install` could not
# resolve it). Instead force-include copies the pure-Pydantic package
# into the magpie wheel at build time: the artifact is self-contained,
# single source is preserved in-repo, the server is unaffected (it runs
# from the workspace, never as a wheel). The vendored copy is frozen at
# CLI build, which is correct - it must match the server wire contract
# at release regardless. See project_followup_cli_standalone_dist.
[tool.hatch.build.targets.wheel.force-include]
"../../packages/openmagpie-schema/src/openmagpie_schema" = "openmagpie_schema"
