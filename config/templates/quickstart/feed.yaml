# The feed the quickstart seeds from: a set of sources to poll for new posts.
# The quickstart copies this, swaps in the subreddits you chose, and writes the
# result to config/quickstart/feed.yaml. Edit that copy (not this template) to
# change your listener; see config/README.md.
name: "Quickstart feed"
kind: curated
poll_interval_seconds: 300
data:
  retention_days: 30
sources:
  - spec: {kind: reddit_subreddit, subreddit: selfhosted}
  - spec: {kind: reddit_subreddit, subreddit: opensource}
  # A feed can mix source kinds; add any of these alongside the subreddits:
  #   - spec: {kind: hn_feed, feed: new}    # Hacker News newest (feed: new | show | ask)
  #   - spec: {kind: hn_feed, feed: show}   # Show HN
  #   - spec: {kind: hn_comment, query: "your product"}   # HN comments matching a keyword
  #   - spec: {kind: rss, url: "https://example.com/feed.xml", name: "Example blog"}
  # HN `query`: words AND by default; add `match: any` for OR, or `-word` to exclude. See config/README.md.
