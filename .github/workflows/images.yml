name: images

# Build + push the deployable images to GHCR. ONLY on a merge to main (which is
# PR-gated) or a manual run — never on tags. Each build publishes an immutable
# `sha-<short>` (+ a moving `latest`); deploys pin a specific sha via a PR in
# the openmagpie-deployments repo, so the release gate is a review, not a tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core API: build context is the repo root (the uv workspace).
          - image: openmagpie-core
            context: .
            dockerfile: apps/core/Dockerfile
          # Email-render sidecar: build context is the web/ pnpm workspace.
          - image: openmagpie-email-render
            context: web
            dockerfile: web/apps/email-render/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/obris-dev/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
