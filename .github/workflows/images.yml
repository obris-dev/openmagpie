# Build + push the deployable images to GHCR. ONLY on a merge to main (which is
# PR-gated) or a manual run, never on tags. Each build publishes an immutable
# `sha-<short>` (+ a moving `latest`); deploys pin a specific sha via a PR in
# the deployments repo, so the release gate is a review, not a tag.
#
# Each image only rebuilds when its build context actually changed (see the
# `changes` job): a web-only merge skips the core build and vice versa. A manual
# `workflow_dispatch` forces BOTH, the force-rebuild escape hatch.
#
# A RELEASE commit (a push to main that changes version.txt against its
# parent, which only release-please's product bump does) builds both images
# and tags them with the version as well: v<x.y.z>, and the rolling v<x.y>
# alias when the version is clean semver. The version tags ride on the build
# of the commit that carries that version, so the tagged image is the one
# whose baked-in version reports it and it is the same digest as its
# sha-<short>. Tagging from a separate workflow on the Release event would
# copy whatever :latest is at that moment, the previous build. A CLI release
# (cli-v<x.y.z>) changes apps/cli only, never version.txt, so it tags no
# image; a manual run never is a release.
name: images

# Build + push the deployable images to GHCR. ONLY on a merge to main (which is
# PR-gated) or a manual run — never on tags. Each build publishes an immutable
# `sha-<short>` (+ a moving `latest`); deploys pin a specific sha via a PR in
# the openmagpie-deployments repo, so the release gate is a review, not a tag.
#
# Each image only rebuilds when its build context actually changed (see the
# `changes` job): a web-only merge skips the core build and vice versa. A manual
# `workflow_dispatch` forces BOTH — the force-rebuild escape hatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Decide which images to build from what the push touched, then emit a dynamic
  # matrix the build job fans out over. The filters track each image's FUNCTIONAL
  # inputs (the files that change the built artifact) — intentionally narrower
  # than the literal Docker build context. core's Dockerfile does `COPY . /app`,
  # so apps/cli + root files ride along, but they're inert in the core image
  # (it runs only openmagpie-core), and any CLI change that actually matters
  # bumps uv.lock — which IS filtered. So a CLI-only edit skipping a core
  # rebuild just leaves an unused, identical-to-source copy embedded; no drift.
  #  - core's context is the repo root; its artifact is apps/core PLUS its
  #    workspace dep packages/openmagpie-schema, resolved via the root
  #    uv.lock/pyproject — all of which must trigger a rebuild.
  #  - email-render's context is web/ and it has NO @magpie/* workspace deps
  #    (just react-email/react/tsx), so web/packages/** is deliberately OMITTED.
  #    If it ever takes a @magpie/* dep, add web/packages/** to its filter.
  # Both include this workflow file, so changing the build itself rebuilds all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The parent commit, to read the version it carried.
          fetch-depth: 2
      - id: release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          prev=$(git show HEAD^:version.txt 2>/dev/null | tr -d '[:space:]' || true)
          cur=$(tr -d '[:space:]' < version.txt)
          if [ "$EVENT" = "push" ] && [ -n "$prev" ] && [ "$prev" != "$cur" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'apps/core/**'
              - 'packages/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - 'version.txt'
              - '.github/workflows/images.yml'
            email:
              - 'web/apps/email-render/**'
              - 'web/pnpm-lock.yaml'
              - 'web/pnpm-workspace.yaml'
              - 'web/package.json'
              - 'version.txt'
              - '.github/workflows/images.yml'
      - id: set
        # Assemble the matrix include[] as JSON. A manual run or a release
        # commit forces both; otherwise include only the images whose filter
        # matched. `[]` (nothing relevant changed) skips the build job via its
        # `if` guard below.
        env:
          BOTH: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release == 'true' }}
          CORE: ${{ steps.filter.outputs.core }}
          EMAIL: ${{ steps.filter.outputs.email }}
        run: |
          core='{"image":"openmagpie-core","context":".","dockerfile":"apps/core/Dockerfile"}'
          email='{"image":"openmagpie-email-render","context":"web","dockerfile":"web/apps/email-render/Dockerfile"}'
          items=()
          if [ "$BOTH" = "true" ] || [ "$CORE" = "true" ]; then items+=("$core"); fi
          if [ "$BOTH" = "true" ] || [ "$EMAIL" = "true" ]; then items+=("$email"); fi
          printf 'matrix=[%s]\n' "$(IFS=,; echo "${items[*]}")" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Skip entirely when nothing relevant changed (e.g. a docs-only merge).
    if: needs.changes.outputs.matrix != '[]'
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version this commit carries, for the release tags below. The
      # rolling alias exists only for clean semver: a pre-release such as
      # 0.10.0-rc.1 must never move v0.10.
      - id: version
        run: |
          ver="v$(tr -d '[:space:]' < version.txt)"
          echo "tag=${ver}" >> "$GITHUB_OUTPUT"
          if printf '%s' "$ver" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "alias=${ver%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "alias=" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/obris-dev/${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ needs.changes.outputs.release == 'true' }}
            type=raw,value=${{ steps.version.outputs.alias }},enable=${{ needs.changes.outputs.release == 'true' && steps.version.outputs.alias != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
