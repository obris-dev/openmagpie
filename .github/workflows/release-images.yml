name: release-images

# The MANUAL escape hatch for image version tags. The normal path is
# images.yml: the release commit's own build pushes v<x.y.z> and the
# v<x.y> alias alongside sha-<short> and latest, so a release never
# waits on this file. This exists for the cases that path cannot serve:
# re-tagging a specific earlier build as a version, or repairing a tag
# by hand. It copies existing manifests (no rebuild), and only after
# both images' sources are confirmed to exist, so a version is
# never applied to one image and not the other.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to apply, e.g. v0.0.1 (clean semver also moves the v<x.y> alias)"
        required: true
      sha:
        description: "Commit sha whose sha-<short> images to tag (both images must have one)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.check.outputs.short }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SRC_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # Only a version may be applied here: a stray name would retag
          # latest or move an alias by accident.
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "refusing: '$RELEASE_TAG' is not a version tag (v<x.y.z>, optional pre-release suffix)" >&2
            exit 1
          fi
          if ! printf '%s' "$SRC_SHA" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "refusing: sha must be 7 to 40 lowercase hex characters" >&2
            exit 1
          fi
          short=$(printf '%s' "$SRC_SHA" | cut -c1-7)
          for image in openmagpie-core openmagpie-email-render; do
            docker buildx imagetools inspect "ghcr.io/obris-dev/${image}:sha-${short}" >/dev/null \
              || { echo "refusing: ghcr.io/obris-dev/${image}:sha-${short} does not exist" >&2; exit 1; }
          done
          echo "short=${short}" >> "$GITHUB_OUTPUT"

  promote:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [openmagpie-core, openmagpie-email-render]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the named build with the version
        env:
          IMAGE: ghcr.io/obris-dev/${{ matrix.image }}
          RELEASE_TAG: ${{ inputs.tag }}
          SHORT: ${{ needs.verify.outputs.short }}
        run: |
          set -euo pipefail
          ver="$RELEASE_TAG"
          src="${IMAGE}:sha-${SHORT}"
          # The rolling alias only for clean semver: a pre-release must not
          # move it.
          tags=(--tag "${IMAGE}:${ver}")
          if printf '%s' "$ver" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            tags+=(--tag "${IMAGE}:${ver%.*}")
          fi
          echo "Tagging ${src} -> ${tags[*]}"
          docker buildx imagetools create "${tags[@]}" "${src}"
          echo "Tagged: ${tags[*]}"
