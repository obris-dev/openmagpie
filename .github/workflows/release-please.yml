name: release-please

# Runs on EVERY push to main, but "running" only means: recompute the pending
# release and open/update the per-track release PR(s). No release happens until
# a human MERGES a release PR - that's the deliberate ship action, and merging
# is what creates the tag (v<x.y.z> for the product, cli-v<x.y.z> for the CLI)
# and the GitHub Release. Config lives in release-please-config.json +
# .release-please-manifest.json (two tracks: the product stack at the repo root,
# and the openmagpie CLI under apps/cli).
#
# TOKEN: with the default GITHUB_TOKEN, the tag/Release that release-please
# creates will NOT trigger other workflows (GitHub's loop-prevention), so the
# image-promotion and PyPI-publish workflows (which key off `release: published`)
# would never fire. To make the release -> publish chain work, provision a PAT
# or GitHub App token as the RELEASE_PLEASE_TOKEN secret (repo contents + PRs,
# and `workflow`); the expression below falls back to GITHUB_TOKEN when it's
# absent, which still maintains the release PRs - it just won't fan out to the
# publishers until the token is set.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
