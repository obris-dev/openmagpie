name: Feature request
description: Suggest a connector, engine, or capability
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: The problem
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: Optional. What would you like to see?
  - type: dropdown
    attributes:
      label: Area
      options:
        - Connector (Reddit/RSS)
        - Engine (Ollama)
        - Watches / actions
        - Webhook delivery
        - CLI
        - Web UI
        - Setup / running locally
        - Other
